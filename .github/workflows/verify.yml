name: Accessibility sync verification
on:
  push:
    branches: [ci/a11y-sync-checks-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 86285b22b66fb1825319b718a76f15eb70c0a63d
          persist-credentials: false
      - uses: flutter-actions/setup-flutter@v4
        with:
          version: '3.47.9'
          channel: stable
      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get
      - name: Check changed widget formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib/widget/dialogs/favorite_dialog.dart lib/widget/custom_icon_button.dart lib/pages/verify_page.dart lib/util/fingerprint_alphabet.dart test/widget/custom_icon_button_test.dart test/unit/util/fingerprint_alphabet_test.dart
      - name: Analyze affected widgets
        working-directory: app
        run: flutter analyze --no-pub lib/widget/dialogs/favorite_dialog.dart lib/widget/custom_icon_button.dart lib/pages/verify_page.dart lib/util/fingerprint_alphabet.dart test/widget/custom_icon_button_test.dart test/unit/util/fingerprint_alphabet_test.dart
      - name: Verify accessibility and preserved scrolling
        working-directory: app
        run: flutter test --no-pub test/widget/custom_icon_button_test.dart test/widget/favorite_dialog_test.dart test/widget/favorite_edit_dialog_test.dart test/unit/util/fingerprint_alphabet_test.dart --reporter expanded
